# Builds the downloads and attaches them to a draft GitHub release. Two ways to start it:
#   - push a release tag (v1.6.0), or
#   - Actions → Release → Run workflow, giving the tag to release as (it is created for you). Leave the tag
#     empty to only build: the files are then kept with the run, as artifacts.
# This fork ships two downloads: the Windows installer and the Android APK. The macOS apps, the Linux packages
# and the unsigned iOS app are still here, and build when a manual run names them ("windows android mac linux ios").
# The draft only goes public when it's published by hand, after checking it.
#
# The APK is signed with the key in these repository secrets (Settings → Secrets and variables → Actions):
#   MUSIKE_KEYSTORE_BASE64    the .jks file, base64-encoded
#   MUSIKE_KEYSTORE_PASSWORD  MUSIKE_KEY_ALIAS  MUSIKE_KEY_PASSWORD
# Always the same key: Android only installs an update signed like the version already on the phone.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Systems to build, separated by spaces: windows android mac linux ios"
        default: "windows android"
      release:
        description: "Tag for a draft release with the files, e.g. v1.6.0 (empty: build only)"
        default: ""

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'push' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter musike-desktop dist
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Windows"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Windows.exe 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Windows.exe, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  mac:
    if: github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'mac')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ad-hoc signed (no Apple Developer ID): enough to run on Apple Silicon; Gatekeeper asks once.
      - run: pnpm --filter musike-desktop dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check downloads
        shell: bash
        run: |
          { echo "### macOS"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-macOS-*.dmg 2>/dev/null | wc -l)
          [ "$found" -eq 2 ] || { echo "::error::Expected 2 file(s) matching *-macOS-*.dmg, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: release/*
          if-no-files-found: error

  linux:
    if: github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'linux')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # AppImage and .deb, for x64 and arm64 (the arm64 ones are packaged here too: nothing is compiled).
      - run: pnpm --filter musike-desktop dist:linux
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Linux"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Linux-* 2>/dev/null | wc -l)
          [ "$found" -eq 4 ] || { echo "::error::Expected 4 file(s) matching *-Linux-*, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/*
          if-no-files-found: error

  android:
    if: github.event_name == 'push' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::MUSIKE_KEYSTORE_BASE64 is not set: the APK will be unsigned and won't install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musike-release.jks"
          echo "MUSIKE_KEYSTORE=$RUNNER_TEMP/musike-release.jks" >> "$GITHUB_ENV"
      - run: pnpm --filter @musike/mobile apk
        env:
          MUSIKE_KEYSTORE_PASSWORD: ${{ secrets.MUSIKE_KEYSTORE_PASSWORD }}
          MUSIKE_KEY_ALIAS: ${{ secrets.MUSIKE_KEY_ALIAS }}
          MUSIKE_KEY_PASSWORD: ${{ secrets.MUSIKE_KEY_PASSWORD }}
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Android"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Android*.apk 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Android*.apk, found $found"; ls -l release; exit 1; }
          # Without the signing secrets the APK comes out as "-Android-unsigned.apk": it has to be signed (always
          # with the same key) before a phone will install it.
          ls release/*-unsigned.apk >/dev/null 2>&1 && echo "::warning::The APK is unsigned: add the MUSIKE_KEYSTORE* secrets, or sign it by hand." || true
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: release/*
          if-no-files-found: error

  ios:
    if: github.event_name == 'workflow_dispatch' && contains(inputs.platforms, 'ios')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unsigned on purpose: AltStore, SideStore or Sideloadly sign it with the user's own Apple ID when installing.
      - run: pnpm --filter @musike/mobile ipa
      - name: Check downloads
        shell: bash
        run: |
          { echo "### iOS"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-iOS.ipa 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-iOS.ipa, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: release/*
          if-no-files-found: error

  release:
    needs: [windows, mac, linux, android, ios]
    # Systems that weren't asked for don't hold the release back; one that failed does.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (startsWith(github.ref, 'refs/tags/v') || inputs.release != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: downloads
          merge-multiple: true
      # A manual run has no tag yet: create it here, on the commit that was built. (Made with the workflow's own
      # token, it doesn't start this workflow a second time.)
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::The release tag must look like v1.6.0, got '$TAG'"; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent \
            || echo "::notice::Tag $TAG already exists: the release is attached to it as it is."
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          draft: true
          body: |
            Musike with offline downloads.

            - **Windows:** run the `-Windows.exe` file. It installs over an older Musike and keeps the library and the downloaded songs.
            - **Android:** open the `-Android.apk` file on the phone. It installs as "Musike+", next to the original app; later versions of this build install over it.
          files: downloads/*
          fail_on_unmatched_files: true
